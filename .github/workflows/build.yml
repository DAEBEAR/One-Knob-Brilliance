name: Build Plugin

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladder-dev \
          mesa-common-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev \
          libxinerama-dev libxext-dev libfreewrap0-dev libxcursor-dev \
          libxcomposite-dev libcurl4-openssl-dev

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Plugin
      run: cmake --build build --config Release -j 4

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: OneKnobSaturator-${{ runner.os }}
        path: |
          build/OneKnobSaturator_artefacts/Release/VST3/
          build/OneKnobSaturator_artefacts/Release/AU/
          build/OneKnobSaturator_artefacts/Release/Standalone/